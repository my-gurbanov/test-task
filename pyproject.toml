[project]
name = "payment-processing"
version = "0.1.0"
description = "Asynchronous payment processing service"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "advanced-alchemy",
    "aio-pika",
    "alembic",
    "backoff",
    "base-client>=0.1.4,<0.2",
    "fastapi",
    "faststream[rabbit]>=0.7.2,<0.8",
    "httpx",
    "microbootstrap[fastapi,faststream,granian]",
    "psycopg",
    "pydantic>=2",
    "sqlalchemy[asyncio]>=2.1,<3",
    "structlog",
    "that-depends",
]

[dependency-groups]
dev = [
    "community-of-python-flake8-plugin",
    "flake8-pyproject",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "ty",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
external = ["COP"]
ignore = ["EM", "FBT", "TRY003", "D1", "D203", "D213", "G004", "FA", "COM812", "ISC001", "TC", "CPY"]

[tool.ruff.lint.isort]
no-lines-before = ["standard-library", "local-folder"]
lines-after-imports = 2

[tool.ruff.lint.flake8-import-conventions.aliases]
datetime = "datetime"

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["S101", "S311", "PLR2004"]
"payment_processing/api/rest.py" = ["RUF003"]
"payment_processing/database/migrations/versions/*.py" = ["INP001"]

[tool.flake8]
select = ["COP"]
exclude = [".venv", ".cache"]
per-file-ignores = ["**/migrations/versions/*.py:COP007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.15"
