name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.15"
      - uses: extractions/setup-just@v3
      - run: just lint
      - run: just test
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
