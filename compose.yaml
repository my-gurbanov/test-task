x-application: &application
  image: payment-processing:local
  build: .
  environment: &application-environment
    API_KEY: ${API_KEY:-local-payment-key}
    DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_port_connectivity]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    <<: *application
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *application
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PAYMENT_HTTP_PORT:-8000}:8000"

  consumer:
    <<: *application
    command: [python, -m, payment_processing.workers.application]
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  tests:
    <<: *application
    profiles: [tests]
    environment:
      <<: *application-environment
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
    depends_on:
      api:
        condition: service_started
      consumer:
        condition: service_started

volumes:
  postgres:
  rabbitmq:
